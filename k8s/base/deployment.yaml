apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-health-api
  namespace: url-health
  labels:
    app: url-health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-health-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: url-health-api
    spec:
      serviceAccountName: url-health-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/bj-gke-platform/apps/url-health-api:v1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STORE
              value: firestore
            - name: GOOGLE_CLOUD_PROJECT
              value: bj-gke-platform
            - name: CHECK_INTERVAL
              value: 60s
            - name: CHECK_TIMEOUT
              value: 5s
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            initialDelaySeconds: 3
      terminationGracePeriodSeconds: 20
